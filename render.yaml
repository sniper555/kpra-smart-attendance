# Render Blueprint. Secrets are not stored here.
# Set the sync:false keys in the Render dashboard or via the API after the service exists.
services:
  - type: web
    name: kpra-attendance-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.entrypoint api
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_DEV_DATA
        value: "false"
      - key: TIMENEX_INTEGRATION_ENABLED
        value: "false"
      - key: TIMENEX_WRITE_MODE
        value: none
      - key: TIMENEX_PORTAL_URL
        value: https://www.timenex.net:8443
      - key: SENSEFACE_ADMS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kpra-attendance-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: TIMENEX_USERNAME
        sync: false
      - key: TIMENEX_PASSWORD
        sync: false
      - key: TIMENEX_PORTAL_ENABLED
        sync: false

databases:
  - name: kpra-attendance-db
    plan: free
    databaseName: attendance
    user: attendance
    region: singapore
